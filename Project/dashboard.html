<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Management System</title>
    <link rel="stylesheet" href="cssdashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            🎓 SMS
        </div>
        <ul>
            <li class="active">
                <a href="dashboard.html">🏠 Dashboard</a>
            </li>
            <li>
                <a href="students.html">👨‍🎓 Students</a>
            </li>
            <li>
                <a href="attendance.html">📅 Attendance</a>
            </li>
            <li>
                <a href="marks.html">📚 Marks</a>
            </li>
            <li id="logout">
                🚪 Logout
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">
        <header>
            <div>
                <h1 id="welcomeGreeting">Dashboard</h1>
                <p id="currentDateText" style="color: var(--gray); font-size: 14px; margin-top: 4px;"></p>
            </div>
            <div class="profile">
                <button id="themeBtn" title="Toggle Theme">🌙</button>
                <img src="profile.jpeg" alt="Admin Avatar" onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=2563eb&color=fff'">
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="cards">
            <div class="card blue">
                <h2>Total Students</h2>
                <h1 id="students">0</h1>
            </div>
            <div class="card green">
                <h2>Present Today</h2>
                <h1 id="present">0</h1>
            </div>
            <div class="card orange">
                <h2>Average Marks</h2>
                <h1 id="avgMarks">0%</h1>
            </div>
            <div class="card red">
                <h2>Passing Rate</h2>
                <h1 id="passRate">0%</h1>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts">
            <div class="chart-card">
                <h3>Attendance Overview</h3>
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Student Performance (Marks)</h3>
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <!-- Recent Students Table -->
        <div class="table">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h2>Recent Students</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="dashboardSearch" placeholder="Search student..." style="padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
                    <a href="students.html" class="btn btn-primary btn-sm" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                        Manage All Students &rarr;
                    </a>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Semester</th>
                        <th>Attendance</th>
                        <th>Marks</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="jsdashboard.js"></script>
</body>
</html>
